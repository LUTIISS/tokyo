name: Deploy to GitHub Pages

# Собирает игру и кладёт сборку в ветку gh-pages, откуда её раздаёт GitHub Pages.
# Адрес: https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Проектная страница живёт в подпапке https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      - name: Check site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="https://${OWNER,,}.github.io/${REPO}/"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "Попытка $i: $url → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::Сайт ещё не отвечает. Если Pages не включился сам: Settings → Pages → Source: Deploy from a branch → gh-pages / (root)."
