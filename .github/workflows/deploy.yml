name: Deploy to GitHub Pages

# Собирает игру и кладёт сборку в ветку gh-pages, откуда её раздаёт GitHub Pages.
# Адрес: https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Проектная страница живёт в подпапке https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      - name: Check site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="https://${OWNER,,}.github.io/${REPO}/"
          # Ищем ровно тот файл сборки, который только что собрали, — иначе проверка
          # пройдёт по старой закэшированной версии и ничего не докажет.
          asset=$(grep -o "/${REPO}/assets/index-[A-Za-z0-9_-]*\.js" dist/index.html | head -1)
          echo "Ждём на сайте: $asset"
          for i in $(seq 1 12); do
            body=$(curl -s -H 'Cache-Control: no-cache' "$url" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || echo 000)
            echo "Попытка $i: HTTP $code $(printf '%s' "$body" | grep -o '<title>[^<]*</title>' | head -1)"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -qF "$asset"; then
              echo "Сайт отдаёт свежую сборку."
              # Первый трек радио: имя с пробелами и кириллицей — проверяем, что он реально отдаётся.
              track=$(node -e 'const t=require("./dist/audio/tracks.json").tracks[0]; if(t) process.stdout.write(encodeURI(t.src));')
              if [ -n "$track" ]; then
                tcode=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1024 "https://${OWNER,,}.github.io${track/#\//\/${REPO}\/}" || echo 000)
                echo "Первый трек радио → HTTP $tcode"
                case "$tcode" in 200|206) ;; *) echo "::warning::Трек не отдаётся (HTTP $tcode) — проверь имя файла";; esac
              fi
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Свежая сборка ещё не поднялась. Проверь Settings → Pages: Source «Deploy from a branch», ветка gh-pages, папка / (root)."
