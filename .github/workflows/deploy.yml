name: Deploy to GitHub Pages

# Собирает игру и кладёт сборку в ветку gh-pages, откуда её раздаёт GitHub Pages.
# Адрес: https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Проектная страница живёт в подпапке https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'

      - name: Check site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          url="https://${OWNER,,}.github.io/${REPO}/"
          for i in 1 2 3 4 5 6 7 8 9; do
            body=$(curl -s -H 'Cache-Control: no-cache' "$url" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Cache-Control: no-cache' "$url" || echo 000)
            title=$(printf '%s' "$body" | grep -o '<title>[^<]*</title>' | head -1)
            echo "Попытка $i: $url → HTTP $code $title"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q "/${REPO}/assets/index-"; then
              echo "Сайт отдаёт сборку игры."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::По адресу пока не сборка игры. Проверь Settings → Pages: Source «Deploy from a branch», ветка gh-pages, папка / (root)."
